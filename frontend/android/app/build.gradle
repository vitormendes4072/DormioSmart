apply plugin: 'com.android.application'

android {
    namespace = "app.dormiosmart.coleta"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.dormiosmart.coleta"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // APP-02: o nucleo do firmware em C++ para os processadores de celular
        // (32 e 64 bits ARM) e o x86_64 do emulador.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // APP-02: o gatilho do roteiro da retomada em MainActivity so vale em depuracao.
    buildFeatures {
        buildConfig true
    }
    // APP-02: compila `firmware/nucleo/` direto do repositorio (ver o CMakeLists).
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    // APP-12 (10/11): a assinatura do APK que vai para os testadores.
    //
    // A chave e a senha ficam FORA do repositorio (que e publico), num arquivo
    // na pasta do usuario: `~/.dormio/assinatura.properties` (ou o de `DORMIO_ASSINATURA`), com
    //   arquivo=<caminho do .jks>
    //   senha=<senha do keystore>
    //   apelido=<alias da chave>
    //   senhaDaChave=<senha da chave>
    // Sem o arquivo, `assembleRelease` gera o APK SEM assinatura (nao instala),
    // em vez de cair para a chave de depuracao: um APK de depuracao nao pode
    // chegar a ninguem por engano. Perder a chave impede atualizar o app ja
    // instalado (o testador desinstala e instala de novo, e perde as noites
    // que ainda nao enviou).
    // `DORMIO_ASSINATURA` aponta para outro arquivo (o teste da assinatura usa
    // uma chave descartavel, sem tocar no arquivo de verdade).
    def assinatura = System.getenv("DORMIO_ASSINATURA") ?
            new File(System.getenv("DORMIO_ASSINATURA")) :
            new File(System.getProperty("user.home"), ".dormio/assinatura.properties")
    signingConfigs {
        if (assinatura.exists()) {
            release {
                def p = new Properties()
                assinatura.withInputStream { p.load(it) }
                storeFile file(p.getProperty("arquivo"))
                storePassword p.getProperty("senha")
                keyAlias p.getProperty("apelido")
                keyPassword p.getProperty("senhaDaChave")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (assinatura.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // APP-02: ServiceCompat e NotificationCompat do servico da noite.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
